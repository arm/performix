version: '3'

includes:
  core:
    taskfile: ./core
    dir: ./core
  internal:
    taskfile: ./Taskfile.internal.yml
    optional: true
    flatten: true

tasks:
  deps:python:
    desc: Install shared Python dependencies in the active venv
    run: once
    env:
      PIP_REQUIRE_VIRTUALENV: '1'
    cmds:
      - 'python -m pip install --disable-pip-version-check --no-deps -r "{{.TASKFILE_DIR}}/requirements.txt"{{if eq OS "windows"}} -r "{{.TASKFILE_DIR}}/requirements-windows.txt"{{end}}'
      - python -m pip check

  deps:python:lock:
    desc: Regenerate pinned Python dependencies from requirements.in
    dir: '{{.TASKFILE_DIR}}'
    deps: [deps:python]
    env:
      PIP_REQUIRE_VIRTUALENV: '1'
      CUSTOM_COMPILE_COMMAND: task deps:python:lock
    cmds:
      - python -m piptools compile --allow-unsafe --no-strip-extras --output-file=requirements.txt requirements.in {{.CLI_ARGS}}

  default:
    desc: List available repository tasks
    cmds:
      - task --list

  install:
    desc: Install dependencies, generate sources, and build project components
    cmds:
      - task: deps
      - task: build

  build:
    desc: Build project components
    cmds:
      - task: core:build
      - task: internal:build
        if: test -f Taskfile.internal.yml

  deps:
    desc: Install repository dependencies
    cmds:
      - task: core:deps
      - task: internal:deps
        if: test -f Taskfile.internal.yml
