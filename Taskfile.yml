version: '3'

includes:
  core:
    taskfile: ./core
    dir: ./core
  internal:
    taskfile: ./Taskfile.internal.yml
    optional: true
    flatten: true

tasks:
  default:
    desc: List available repository tasks
    cmds:
      - task --list

  install:
    desc: Install dependencies, generate sources, and build project components
    cmds:
      - task: deps
      - task: build

  build:
    desc: Build project components
    cmds:
      - task: core:build
      - task: internal:build
        if: test -f Taskfile.internal.yml

  deps:
    desc: Install repository dependencies
    cmds:
      - task: core:deps
      - task: internal:deps
        if: test -f Taskfile.internal.yml
