syntax = "proto3";

package grpc.health.v1;

option go_package = "github.com/Arm-Debug/apap-cli/clients/go/healthproto";

service Health {
    rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
    string service = 1;
}

message HealthCheckResponse {
    enum ServingStatus {
        UNKNOWN = 0;
        SERVING = 1;
        NOT_SERVING = 2;
    }

    ServingStatus status = 1;
}
