version: '3'

vars:
  APX_BINARY: '{{if eq OS "windows"}}apx.exe{{else}}apx{{end}}'
  BASH_RUNNER: 'python "{{.TASKFILE_DIR}}/scripts/run-bash.py"'
  DEFAULT_APX_BUILD_TAGS: duckdb_arrow
  LOCAL_TOOLS: target_agent sysutil-timeline pytorch-collect parquet-writer parquet-to-json
  INTERNAL_LOCAL_TOOLS: ''
  # The optional internal Taskfile adds JavaScript lint to this list.
  LINT_TASKS: [lint:go, lint:robot]

includes:
  internal:
    taskfile: ./Taskfile.internal.yml
    optional: true
    flatten: true

tasks:
  default:
    desc: List available core tasks
    cmds:
      - task --list

  # Task names should use colon-delimited namespaces for grouped workflows:
  # <area>:<action>[:<scope>]. Keep aggregate tasks at the namespace root
  # where practical, and use a plain verb only for simple utility tasks.

  install:
    desc: Install dependencies, generate sources, and build core binaries
    cmds:
      - task: deps
      - task: build

  build:
    desc: Generate sources and build core binaries
    cmds:
      - task: generate
      - task: build:apx

  generate:
    desc: Generate all sources (Go, Protobuf, Messages, etc.)
    cmds:
      - '{{.BASH_RUNNER}} ./scripts/generate-all.sh'

  deps:tools:
    desc: Package tools (optionally TOOL=<name>)
    vars:
      TOOL: '{{default "" .TOOL}}'
    env:
      PERFORMIX_ENGINE_VERSION: &engine-version
        sh: 'python "{{.TASKFILE_DIR}}/scripts/get_atperf_version.py" --dev'
      # Dependency setup skips the agent unless explicitly selected.
      SKIP_APX_AGENT_BUILD: '{{if eq .TOOL ""}}true{{end}}'
    deps: [':deps:python']
    cmds:
      - 'python scripts/get-tools.py {{if .TOOL}}{{.TOOL | shellQuote}}{{end}}'

  deps:tools_and_agent:
    desc: Package all tools and build the Performix agent
    deps: [':deps:python']
    cmds:
      - python scripts/get-tools.py

  deps:tools:python:
    desc: Install shared Python dependencies for Core tools and tests
    deps: [':deps:python']

  generate:arm-cpus:
    desc: Download Arm CPU data and regenerate the Go source
    deps: [deps:tools:python]
    cmds:
      - 'python scripts/update-arm-cpus.py'

  telemetry:validate:
    desc: Validate CPU telemetry specifications against the vendored schemas
    deps: [':deps:python']
    cmds:
      - 'python scripts/validate_telemetry.py'

  deps:
    desc: Install dependencies required by the current checkout
    cmds:
      - task: internal:deps:prepare
        if: test -f Taskfile.internal.yml
      - task: deps:tools
      - task: internal:deps:finish
        if: test -f Taskfile.internal.yml

  build:apx:
    desc: Build the APX binary
    dir: apap-cli
    deps: [build:tools]
    env:
      PERFORMIX_ENGINE_VERSION: *engine-version
    cmds:
      - go build -tags={{default .DEFAULT_APX_BUILD_TAGS .APX_BUILD_TAGS}} -ldflags="-X github.com/Arm-Debug/apap-cli/atperf-version/versions.version=$PERFORMIX_ENGINE_VERSION" -v -o {{.APX_BINARY}}

  build:tools:
    desc: Build all local tool bundles
    env:
      PERFORMIX_ENGINE_VERSION: *engine-version
    cmds:
      - 'python scripts/get-tools.py {{.LOCAL_TOOLS}} {{.INTERNAL_LOCAL_TOOLS}}'

  build:agent:
    desc: Build the Performix agent
    env:
      PERFORMIX_ENGINE_VERSION: *engine-version
    cmds:
      - task: deps:tools
        vars:
          TOOL: target_agent

  build:execution-probe:
    desc: Build the execution contract probe for a test target
    dir: atperf-agent
    requires:
      vars: [TARGET_GOOS, TARGET_GOARCH, OUTPUT]
    env:
      GOOS: '{{.TARGET_GOOS}}'
      GOARCH: '{{.TARGET_GOARCH}}'
      CGO_ENABLED: '0'
    cmds:
      - go build -o '{{.OUTPUT}}' ./process/processcontracttest/testdata/processprobe

  test:execution:
    desc: Test structured execution helpers and agent lifecycle behaviour
    dir: apap-engine
    cmds:
      - go test -tags=duckdb_arrow ./conductor ./tool ./tool/deployer ./targetsession ./agent
      - go -C ../atperf-agent test ./process ./grpcserver ./cmd

  clean:
    desc: Remove core build outputs
    cmds:
      - rm -f apap-cli/apx apap-cli/apx.exe
      - rm -rf apap-cli/tools
      - rm -rf apap-cli/tools-*-*
      - task: internal:clean
        if: test -f Taskfile.internal.yml

  lint:
    desc: Run Core linters (pass -- --fix to apply fixes)
    requires:
      vars:
        - name: CLI_ARGS
          enum: ['', '--fix']
    # Task runs dependencies concurrently; the language linters are independent.
    deps:
      - for: {var: LINT_TASKS}
        task: '{{.ITEM}}'

  lint:go:
    desc: Lint all Core Go modules (pass -- --fix to apply fixes)
    requires:
      vars:
        - name: CLI_ARGS
          enum: ['', '--fix']
    # Discover all Go modules. Always rerun lint, even when go.mod is unchanged.
    sources: ['**/go.mod']
    method: none
    cmds:
      # Call the task below sequentially for each go.mod. ITEM is its path;
      # the dir template function extracts the module's directory.
      - for: sources
        task: lint:go:module
        vars:
          MODULE_DIR: '{{dir .ITEM}}'

  lint:go:module:
    internal: true
    # Run from the module directory so ./... covers only that module.
    dir: '{{.MODULE_DIR}}'
    cmds:
      - >-
        golangci-lint run --build-tags=duckdb_arrow ./... {{.CLI_ARGS}}
        --output.text.print-issued-lines --output.text.print-linter-name
        --output.text.colors --timeout 300s
        --max-issues-per-linter 0 --max-same-issues 0

  lint:robot:
    desc: Run the Robocop linter for Robot Framework files
    dir: robot
    deps:
      - task: deps:tools:python
    cmds:
      - 'python -m robocop check --config robocop.toml'
