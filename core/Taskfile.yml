version: '3'

vars:
  APX_BINARY: '{{if eq OS "windows"}}apx.exe{{else}}apx{{end}}'
  PYTHON_SYSTEM: '{{if eq OS "windows"}}python{{else}}python3{{end}}'
  TOOLS_PYTHON: '{{.PYTHON_SYSTEM}}'
  DEFAULT_APX_BUILD_TAGS: duckdb_arrow

includes:
  internal:
    taskfile: ./Taskfile.internal.yml
    optional: true
    flatten: true

tasks:
  default:
    desc: List available core tasks
    cmds:
      - task --list

  # Task names should use colon-delimited namespaces for grouped workflows:
  # <area>:<action>[:<scope>]. Keep aggregate tasks at the namespace root
  # where practical, and use a plain verb only for simple utility tasks.

  install:
    desc: Install dependencies, generate sources, and build core binaries
    cmds:
      - task: deps
      - task: generate
      - task: build

  build:
    desc: Build core binaries
    cmds:
      - task: build:apx
      - task: build:agent

  generate:
    desc: Generate all sources (Go, Protobuf, Messages, etc.)
    cmds:
      - ./scripts/go/generate-all.sh
      - ./scripts/protobuf/generate.sh

  deps:tools:
    desc: Package the tools available in the current checkout
    env:
      SKIP_APX_AGENT_BUILD: true
    cmds:
      - '{{.TOOLS_PYTHON}} scripts/get-tools.py'

  deps:
    desc: Install dependencies required by the current checkout
    cmds:
      - task: internal:deps:prepare
        if: test -f Taskfile.internal.yml
      - task: deps:tools
      - task: internal:deps:finish
        if: test -f Taskfile.internal.yml

  build:apx:
    desc: Build the APX binary
    dir: apap-cli
    cmds:
      - go build -tags={{default .DEFAULT_APX_BUILD_TAGS .APX_BUILD_TAGS}} -v -o {{.APX_BINARY}}

  build:agent:
    desc: Build the Performix agent; requires deps:tools:python
    cmds:
      - '{{.TOOLS_PYTHON}} scripts/get-tools.py target_agent'

  clean:
    desc: Remove core build outputs
    cmds:
      - rm -f apap-cli/apx apap-cli/apx.exe
      - rm -rf apap-cli/tools
      - rm -rf apap-cli/tools-*-*
      - task: internal:clean
        if: test -f Taskfile.internal.yml
