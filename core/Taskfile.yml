version: '3'

vars:
  APX_BINARY: '{{if eq OS "windows"}}apx.exe{{else}}apx{{end}}'
  PYTHON_SYSTEM: '{{if eq OS "windows"}}python{{else}}python3{{end}}'
  PYTHON_VENV: '{{if eq OS "windows"}}.venv/Scripts/python.exe{{else}}.venv/bin/python{{end}}'
  TOOLS_PYTHON: '{{.PYTHON_SYSTEM}}'
  BASH_RUNNER: '{{.PYTHON_SYSTEM}} "{{.TASKFILE_DIR}}/scripts/run-bash.py"'
  DEFAULT_APX_BUILD_TAGS: duckdb_arrow
  # The optional internal Taskfile adds JavaScript lint to this list.
  LINT_TASKS: [lint:go, lint:robot]

includes:
  internal:
    taskfile: ./Taskfile.internal.yml
    optional: true
    flatten: true

tasks:
  default:
    desc: List available core tasks
    cmds:
      - task --list

  # Task names should use colon-delimited namespaces for grouped workflows:
  # <area>:<action>[:<scope>]. Keep aggregate tasks at the namespace root
  # where practical, and use a plain verb only for simple utility tasks.

  install:
    desc: Install dependencies, generate sources, and build core binaries
    cmds:
      - task: deps
      - task: build

  build:
    desc: Generate sources and build core binaries
    cmds:
      - task: generate
      - task: build:apx
      - task: build:agent

  generate:
    desc: Generate all sources (Go, Protobuf, Messages, etc.)
    cmds:
      - '{{.BASH_RUNNER}} ./scripts/generate-all.sh'

  deps:tools:
    desc: Package the tools available in the current checkout
    env:
      SKIP_APX_AGENT_BUILD: true
    cmds:
      - '{{.TOOLS_PYTHON}} scripts/get-tools.py'

  deps:tools:python:
    desc: Install Python dependencies for Core tools and tests
    cmds:
      - '{{.PYTHON_SYSTEM}} -m venv .venv'
      - '{{.PYTHON_VENV}} -m pip install --disable-pip-version-check -r robot/requirements.txt'
      - '{{.PYTHON_VENV}} -c "from pathlib import Path; Path(''.venv/.deps-installed'').touch()"'

  generate:arm-cpus:
    desc: Download Arm CPU data and regenerate the Go source
    deps: [deps:tools:python]
    cmds:
      - '{{.PYTHON_VENV}} scripts/update-arm-cpus.py'

  telemetry:validate:
    desc: Validate CPU telemetry specifications against the vendored schemas
    cmds:
      - '{{.TOOLS_PYTHON}} scripts/validate_telemetry.py'

  deps:
    desc: Install dependencies required by the current checkout
    cmds:
      - task: internal:deps:prepare
        if: test -f Taskfile.internal.yml
      - task: deps:tools
      - task: internal:deps:finish
        if: test -f Taskfile.internal.yml

  build:apx:
    desc: Build the APX binary
    dir: apap-cli
    cmds:
      - go build -tags={{default .DEFAULT_APX_BUILD_TAGS .APX_BUILD_TAGS}} -v -o {{.APX_BINARY}}

  build:agent:
    desc: Build the Performix agent; requires deps:tools:python
    cmds:
      - '{{.TOOLS_PYTHON}} scripts/get-tools.py target_agent'

  clean:
    desc: Remove core build outputs
    cmds:
      - rm -f apap-cli/apx apap-cli/apx.exe
      - rm -rf apap-cli/tools
      - rm -rf apap-cli/tools-*-*
      - task: internal:clean
        if: test -f Taskfile.internal.yml

  lint:
    desc: Run Core linters (pass -- --fix to apply fixes)
    requires:
      vars:
        - name: CLI_ARGS
          enum: ['', '--fix']
    # Task runs dependencies concurrently; the language linters are independent.
    deps:
      - for: {var: LINT_TASKS}
        task: '{{.ITEM}}'

  lint:go:
    desc: Lint all Core Go modules (pass -- --fix to apply fixes)
    requires:
      vars:
        - name: CLI_ARGS
          enum: ['', '--fix']
    # Discover all Go modules. Always rerun lint, even when go.mod is unchanged.
    sources: ['**/go.mod']
    method: none
    cmds:
      # Call the task below sequentially for each go.mod. ITEM is its path;
      # the dir template function extracts the module's directory.
      - for: sources
        task: lint:go:module
        vars:
          MODULE_DIR: '{{dir .ITEM}}'

  lint:go:module:
    internal: true
    # Run from the module directory so ./... covers only that module.
    dir: '{{.MODULE_DIR}}'
    cmds:
      - >-
        golangci-lint run --build-tags=duckdb_arrow ./... {{.CLI_ARGS}}
        --output.text.print-issued-lines --output.text.print-linter-name
        --output.text.colors --timeout 300s
        --max-issues-per-linter 0 --max-same-issues 0

  lint:robot:
    desc: Run the Robocop linter for Robot Framework files
    dir: robot
    deps:
      - task: deps:tools:python
    cmds:
      - '../{{.PYTHON_VENV}} -m robocop check --config robocop.toml'
