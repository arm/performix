[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pytorch_collect*"]

[project]
name = "pytorch-collect"
version = "0.1.0"
description = "Trace and collect PyTorch API calls and operator calls."
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = ["torch"]

[project.optional-dependencies]
samples = ["torch", "transformers"]
test = ["pytest", "pyarrow"]

[project.scripts]
pytorch-collect = "pytorch_collect.cli:main"
